<!doctype html><html><body><pre id="out"></pre><script>
      function quality(file, done) {
        var url = URL.createObjectURL(file), img = new Image();
        img.onload = function () {
          var scale = Math.min(1, 1000 / Math.max(img.naturalWidth, img.naturalHeight));
          var w = Math.max(3, Math.round(img.naturalWidth * scale)), h = Math.max(3, Math.round(img.naturalHeight * scale));
          var c = document.createElement('canvas');
          c.width = w; c.height = h;
          var ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          var px = ctx.getImageData(0, 0, w, h).data, g = new Float32Array(w * h), light = 0;
          for (var i = 0, j = 0; i < px.length; i += 4, j++) {
            g[j] = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
            light += g[j];
          }
          var edges = new Float32Array((w - 2) * (h - 2)), n = 0;
          for (var y = 1; y < h - 1; y++) {
            for (var x = 1; x < w - 1; x++) {
              var k = y * w + x;
              edges[n++] = Math.abs(g[k - w] + g[k + w] + g[k - 1] + g[k + 1] - 4 * g[k]);
            }
          }
          edges.sort();
          URL.revokeObjectURL(url);
          done({ sharpness: edges[Math.floor(n * 0.995)], brightness: light / (w * h), width: img.naturalWidth, height: img.naturalHeight });
        };
        img.onerror = function () { URL.revokeObjectURL(url); done(null); };
        img.src = url;
      }
var names=['sharp','blur2','blur3','blur4','blur6','blur10','dark','small'], out=[];
(function next(i){ if(i>=names.length){document.getElementById('out').textContent=out.join('\n');return;}
 fetch(names[i]+'.jpg').then(r=>r.blob()).then(b=>quality(new File([b],names[i]+'.jpg',{type:'image/jpeg'}),function(q){
  var problem=Math.min(q.width,q.height)<500?'SMALL':q.brightness<45?'DARK':q.sharpness<40?'BLURRY':'ok';
  out.push(names[i]+' sharp='+q.sharpness.toFixed(1)+' bright='+q.brightness.toFixed(0)+' -> '+problem);next(i+1);}));})(0);
</script></body></html>
