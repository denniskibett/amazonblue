<!doctype html><html><body><pre id="out"></pre><script>
function measure(img, max){
  var s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s);
  var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(img,0,0,w,h);
  var p=x.getImageData(0,0,w,h).data,g=new Float32Array(w*h);for(var i=0,j=0;i<p.length;i+=4,j++)g[j]=.299*p[i]+.587*p[i+1]+.114*p[i+2];
  var a=[],sum=0,sum2=0,n=0;for(var yy=1;yy<h-1;yy++)for(var xx=1;xx<w-1;xx++){var k=yy*w+xx,l=g[k-w]+g[k+w]+g[k-1]+g[k+1]-4*g[k];a.push(Math.abs(l));sum+=l;sum2+=l*l;n++;}
  a.sort(function(u,v){return u-v});var m=sum/n;
  // gradient-based: mean of top 1% sobel magnitude
  return 'var='+(sum2/n-m*m).toFixed(0)+' p99.5='+a[Math.floor(a.length*.995)].toFixed(0)+' p99.9='+a[Math.floor(a.length*.999)].toFixed(0);
}
var names=['sharp','blur2','blur3','blur4','blur6','blur10','dark','small'],out=[];
(function next(i){if(i>=names.length){document.getElementById('out').textContent=out.join('\n');return;}
 var im=new Image();im.onload=function(){out.push(names[i]+' | 1000: '+measure(im,1000)+' | 640: '+measure(im,640));next(i+1)};im.src=names[i]+'.jpg';})(0);
</script></body></html>
