; Uploads (owner, 22 Oct 2026): KYC photos, selfies and company documents. The browser already shrinks photos to
; well under 1 MB; these limits leave room for PDFs. Read by PHP-FPM / LSAPI on the server (php.ini still wins
; where the host locks it; then raise them in the hosting panel).
upload_max_filesize = 12M
post_max_size = 40M
max_file_uploads = 20

; Owner, 15 Nov 2026: this server ignores .user.ini; the real limits are set per site in the LiteSpeed vhost
; (/usr/local/lsws/conf/vhosts/loans.sharet.africa/vhost.conf, phpIniOverride): uploads up to 2048 MB.
upload_max_filesize = 2048M
post_max_size = 2048M
max_input_time = 600
